name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write        # OIDC — no static AWS keys anywhere in this repo
  pull-requests: write

jobs:
  static:
    name: fmt / lint / security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
      - run: tflint --recursive --format compact

      # tfsec is EOL — folded into Trivy's `config` scanner, same rule engine
      - name: trivy — IaC misconfiguration scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          quiet: true
          soft_fail: false

  plan:
    name: plan
    needs: static
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [live/org-root, live/security, live/workload-dev]
    steps:
      - uses: actions/checkout@v4

