name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege. `id-token: write` comes back with modules/iam-oidc, when
# there is actually a role to assume — not before.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit SHA, not a tag. A tag is mutable:
# whoever controls the action repo can repoint it at new code, which is T7 with
# extra steps. The trailing comment records the human-readable version.
jobs:
  static:
    name: fmt / lint / security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8" # keep in sync with docs/toolchain.md
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0 # keep in sync with docs/toolchain.md
      - name: tflint
        run: tflint --recursive --format compact

      # tfsec is EOL — folded into Trivy's `config` scanner, same rule engine.
      # HIGH,CRITICAL only here; the LOW findings are triaged locally with
      # written justifications in live/*/.trivyignore.
      - name: trivy — IaC misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0 # keep in sync with docs/toolchain.md
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      # checkov runs from pip, not bridgecrewio/checkov-action.
      #
      # That action — even at its newest release — runs a Docker image pinned
      # to `bridgecrew/checkov:2.0.930`, a 2021 build. It fails CKV_AWS_19/21/145
      # on this repo because it looks for an inline
      # `server_side_encryption_configuration` block inside `aws_s3_bucket`,
      # which the AWS provider replaced with standalone resources in v4. The
      # bucket is encrypted and versioned; the scanner is too old to see it.
      #
      # A gate that reports findings the code does not have is worse than no
      # gate: it trains you to ignore it. Pinning the real package to the same
      # version used locally means CI and a developer's machine cannot disagree.
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: checkov
        run: |
          pip install --quiet checkov==3.3.8
          checkov -d . --framework terraform --quiet --compact

  validate:
    name: validate
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every root module under live/ belongs here. A stack missing from
        # this list is not validated by anything, and nothing warns you.
        stack:
          [
            live/bootstrap,
            live/org-root,
            live/guardrails,
            live/logging,
            live/detection,
            live/ci-oidc,
          ]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # -backend=false skips the S3 backend entirely, so this needs no AWS
      # credentials and still catches type errors, bad references and provider
      # schema violations. The committed lock file means CI resolves the same
      # provider build the evidence was produced with.
      - name: init (no backend)
        working-directory: ${{ matrix.stack }}
        run: terraform init -backend=false -input=false

      - name: validate
        working-directory: ${{ matrix.stack }}
        run: terraform validate -no-color

  # Real plan against real AWS, using the read-only OIDC role from
  # live/ci-oidc. No access key exists to leak: GitHub mints a short-lived
  # token, AWS exchanges it, and the role's trust policy pins the `sub` claim
  # to this repository.
  #
  # Concrete IDs come from repository *variables*, not from git. They are
  # identifiers rather than secrets, but the repo keeps them out of version
  # control by convention and the same convention applies here.
  plan:
    name: plan
    needs: static
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required to request the OIDC token

    strategy:
      fail-fast: false
      matrix:
        # live/logging and live/detection are absent on purpose.
        #
        # Both configure providers that assume OrganizationAccountAccessRole in
        # member accounts, which carries AdministratorAccess. Planning them from
        # CI would mean granting a role that runs on *unreviewed pull requests*
        # the ability to assume administrator in every account in the
        # organization. That is T1 with the front door held open, and no amount
        # of read-only policy on the CI role itself would contain it.
        #
        # The fix is a dedicated read-only role per member account, trusting
        # only the plan role, with the assumed role name a variable. Until that
        # exists, these two stacks are covered by `validate` and by a local
        # plan before apply — which is stated here rather than papered over.
        # live/ci-oidc is also temporarily absent while this branch bootstraps
        # the member read-only roles it now owns. It returns with the other two
        # stacks before this pull request is eligible to merge.
        stack: [live/bootstrap, live/org-root, live/guardrails]

    env:
      # Terraform ignores TF_VAR_* for variables a stack does not declare, so
      # one union of values covers every stack.
      TF_VAR_profile: "" # provider falls back to the OIDC credentials
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_account_id: ${{ vars.TF_ACCOUNT_ID }}
      TF_VAR_organization_id: ${{ vars.TF_ORGANIZATION_ID }}
      TF_VAR_log_archive_account_id: ${{ vars.TF_LOG_ARCHIVE_ID }}
      TF_VAR_state_bucket_arn: ${{ vars.TF_STATE_BUCKET_ARN }}
      TF_VAR_state_kms_key_arn: ${{ vars.TF_STATE_KMS_KEY }}
      TF_VAR_account_ids: ${{ vars.TF_ACCOUNT_IDS }}
      TF_VAR_scp_targets: ${{ vars.TF_SCP_TARGETS }}
      TF_VAR_additional_subject_prefixes: ${{ vars.TF_SUBJECT_PREFIXES }}
      TF_VAR_member_role_name: awlz-gha-plan-readonly
      # A secret rather than a variable: this one carries the member account
      # root email addresses, and secrets are masked in logs.
      TF_VAR_member_accounts: ${{ secrets.TF_MEMBER_ACCOUNTS }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: awlz-ci-plan

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: init
        working-directory: ${{ matrix.stack }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=$(basename ${{ matrix.stack }})/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY }}" \
            -backend-config="use_lockfile=true"

      # -lock=false because the plan role is denied state writes on purpose.
      # A read-only plan has no business taking a lock that a failed run would
      # leave behind for someone to force-unlock.
      - name: plan
        working-directory: ${{ matrix.stack }}
        run: terraform plan -input=false -lock=false -no-color
