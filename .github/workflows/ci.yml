name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege. `id-token: write` comes back with modules/iam-oidc, when
# there is actually a role to assume — not before.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit SHA, not a tag. A tag is mutable:
# whoever controls the action repo can repoint it at new code, which is T7 with
# extra steps. The trailing comment records the human-readable version.
jobs:
  static:
    name: fmt / lint / security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8" # keep in sync with docs/toolchain.md
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0 # keep in sync with docs/toolchain.md
      - name: tflint
        run: tflint --recursive --format compact

      # tfsec is EOL — folded into Trivy's `config` scanner, same rule engine.
      # HIGH,CRITICAL only here; the LOW findings are triaged locally with
      # written justifications in live/*/.trivyignore.
      - name: trivy — IaC misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0 # keep in sync with docs/toolchain.md
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      # checkov runs from pip, not bridgecrewio/checkov-action.
      #
      # That action — even at its newest release — runs a Docker image pinned
      # to `bridgecrew/checkov:2.0.930`, a 2021 build. It fails CKV_AWS_19/21/145
      # on this repo because it looks for an inline
      # `server_side_encryption_configuration` block inside `aws_s3_bucket`,
      # which the AWS provider replaced with standalone resources in v4. The
      # bucket is encrypted and versioned; the scanner is too old to see it.
      #
      # A gate that reports findings the code does not have is worse than no
      # gate: it trains you to ignore it. Pinning the real package to the same
      # version used locally means CI and a developer's machine cannot disagree.
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: checkov
        run: |
          pip install --quiet checkov==3.3.8
          checkov -d . --framework terraform --quiet --compact

  validate:
    name: validate
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every root module under live/ belongs here. A stack missing from
        # this list is not validated by anything, and nothing warns you.
        stack:
          [
            live/bootstrap,
            live/org-root,
            live/guardrails,
            live/logging,
            live/detection,
          ]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # -backend=false skips the S3 backend entirely, so this needs no AWS
      # credentials and still catches type errors, bad references and provider
      # schema violations. The committed lock file means CI resolves the same
      # provider build the evidence was produced with.
      - name: init (no backend)
        working-directory: ${{ matrix.stack }}
        run: terraform init -backend=false -input=false

      - name: validate
        working-directory: ${{ matrix.stack }}
        run: terraform validate -no-color

# There is deliberately no `plan` job yet. Planning needs AWS credentials,
# which means the OIDC role from modules/iam-oidc. A job that echoes a TODO
# and exits 0 is a green check that asserts nothing — worse than a missing
# one, because it looks like coverage. It comes back when the role exists.
